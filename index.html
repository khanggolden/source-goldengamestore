<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Games Store - Trang Chủ</title>
    <!-- Font Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.95)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Khung chính phong cách kính mờ Glassmorphism */
        .card-container {
            background-color: rgba(23, 24, 33, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 2;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .brand-logo i {
            font-size: 34px;
            color: #f7d070;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Form nhập mật khẩu */
        .pin-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .pin-input {
            width: 100%;
            max-width: 320px;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
        }

        .pin-input:focus {
            border-color: #f9c553;
            box-shadow: 0 0 15px rgba(249, 197, 83, 0.3);
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(180deg, #ffe17d 0%, #f9c553 100%);
            color: #111111;
            font-weight: 700;
            font-size: 16px;
            padding: 15px 42px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(249, 197, 83, 0.3);
            transition: all 0.25s ease;
            width: 100%;
            max-width: 320px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(249, 197, 83, 0.45);
        }

        .error-msg {
            color: #ff5252;
            font-size: 14px;
            font-weight: 600;
            display: none;
            margin-top: 5px;
        }

        /* Banner Chân Trang (Logo ngoài khung) */
        .footer-logo-container {
            margin-top: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            user-select: none;
        }

        .footer-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .adm-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111111;
            font-weight: 900;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            position: relative;
        }

        .adm-logo-badge::after {
            content: '';
            position: absolute;
            right: -4px;
            bottom: -2px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid #e53935;
            transform: rotate(45deg);
        }

        .brand-company {
            display: flex;
            flex-direction: column;
            text-align: left;
            line-height: 1.1;
        }

        .company-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .company-sub {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #e0e0e0;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @media (max-width: 480px) {
            .card-container { padding: 40px 20px; }
            .footer-logo-container { flex-direction: flex-row; gap: 8px; }
            .footer-text { font-size: 16px; }
            .company-name { font-size: 15px; }
            .company-sub { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContainer">
        <div class="brand-logo">
            <i class="fa-solid fa-gamepad"></i>
            <span class="brand-title">Golden Games Store</span>
        </div>

        <form class="pin-box" onsubmit="verifyPin(event)">
            <input type="password" id="pinInput" class="pin-input" placeholder="NHẬP MẬT KHẨU" autocomplete="off" required>
            <div id="errorMsg" class="error-msg">Mật khẩu không đúng. Vui lòng thử lại!</div>
            <button type="submit" class="btn-action">
                <span>Xác Nhận</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <!-- Banner Chân Trang (Logo ngoài khung) -->
    <div class="footer-logo-container">
        <span class="footer-text">Dự Án Sân Chơi thuộc</span>
        <div class="adm-logo-badge">ADM</div>
        <div class="brand-company">
            <span class="company-name">ANDROMEDA</span>
            <span class="company-sub">CONTINENTAL</span>
        </div>
    </div>

    <script>
        // Link Notion đã mã hóa Base64
        const _encUrl = "aHR0cHM6Ly9raGFuZ2dvbGRlbi5ub3Rpb24uc2l0ZS9Hb2xkZW4tR2FtZXMtU3RvcmUtMWMyODJmMzkzNDgxODBiMGJkMTNkNmQ3YzcxOWI4M2Y=";
        const _correctPin = "2424";

        // Kiểm tra Session khi vừa tải trang
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.search) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        function verifyPin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('pinInput').value.trim();
            const errorElement = document.getElementById('errorMsg');
            const card = document.getElementById('cardContainer');

            if (inputVal === _correctPin) {
                errorElement.style.display = 'none';

                // Lưu khóa xác thực vào SessionStorage (tự hủy khi tắt tab/trình duyệt)
                const sessionKey = 'sess_' + Math.random().toString(36).substring(2, 9);
                sessionStorage.setItem('_ggs_auth', sessionKey);

                // Chuyển hướng sang trang đích Notion
                window.location.href = atob(_encUrl);
            } else {
                errorElement.style.display = 'block';
                card.classList.remove('shake');
                void card.offsetWidth; // Trigger reflow
                card.classList.add('shake');
                document.getElementById('pinInput').value = '';
                document.getElementById('pinInput').focus();
            }
        }
    </script>
</body>
</html>
